services:
  # PHP-FPM 
  php-fpm:
    build:
      context: ./.dockerfiles/php-fpm
      args:
        - SSDOCKER_PHP_VERSION=${PHP_VERSION}
        - INSTALL_ZIP_ARCHIVE=true
        - INSTALL_OPCACHE=true
        - INSTALL_MYSQLI=true
        - INSTALL_INTL=true
    volumes:
      - ./.dockerfiles/php-fpm/php${PHP_VERSION}.ini:/usr/local/etc/php/php.ini
      - ${VOLUMES_PATH_HOST}/code/www/:/var/www:cached
      - ${VOLUMES_PATH_HOST}/logs/php-fpm/:/var/log/php-fpm
    expose:
      - "9000"
    extra_hosts:
      - "dockerhost:10.0.75.1"
    environment:
      - PHP_IDE_CONFIG=serverName=lnmp-ssdocker
    networks:
      - ssdocker


  # NGINX Server 
  nginx:
    build:
      context: ./.dockerfiles/nginx
      args:
        - PHP_UPSTREAM_CONTAINER=php-fpm
        - PHP_UPSTREAM_PORT=9000
    privileged: true
    volumes:
      - ${VOLUMES_PATH_HOST}/code/www/:/var/www:cached
      - ${VOLUMES_PATH_HOST}/logs/nginx/:/var/log/nginx
      - ${VOLUMES_PATH_HOST}/code/vhost/:/etc/nginx/sites-available
    ports:
      - "9000:80"
      - "9043:443"
    depends_on:
      - php-fpm
    networks:
      - ssdocker

  # MySQL 8.4.3
  mysql:
    build:
      context: ./.dockerfiles/mysql
    environment:
      - MYSQL_DATABASE=default
      - MYSQL_USER=default
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - TZ=Asia/Shanghai
    privileged: true
    volumes:
      - ${VOLUMES_PATH_HOST}/data/mysql:/var/lib/mysql
      - ${VOLUMES_PATH_HOST}/logs/mysql/:/var/log/mysql
    ports:
      - "3306:3306"
    networks:
      - ssdocker

  # Bitwarden Password Manangement 
  bitwarden:
    image: vaultwarden/server:1.32.7
    container_name: bitwarden
    environment:
      - SIGNUPS_ALLOWED=true
      - INVITATIONS_ALLOWED=true
      - ADMIN_TOKEN=${BW_ADMIN_TOKEN}
    volumes:
      - ${VOLUMES_PATH_HOST}/data/bitwarden/:/data/
    ports:
      - "8002:80"
      - "8012:3012"
    restart: always
    networks:
      - ssdocker

  # Fileserver
  fileserver:
    image: peterberweiler/fileserver
    container_name: fileserver
    environment:
        # all of these are optional
      - BASEPATH=/
      - BASIC_AUTH_ENABLED=false 
      - BASIC_AUTH_REALM=admin 
      - BASIC_AUTH_USER=admin 
      - BASIC_AUTH_PASSWORD=pino2025up 
    volumes:
      - ${VOLUMES_PATH_HOST}/data/files:/public
    ports:
      - "9080:80"
    restart: unless-stopped

  # DokuWiki: Local wiki
  dokuwiki:
    image: dokuwiki/dokuwiki:stable # other tags: master, <date> or <codename>
    user: "1000:1000" # adjust to your required user id
    restart: unless-stopped
    ports:
      - "8080:8080" # internal port is 8080, map to what you need
    environment:
      - PHP_TIMEZONE=Asia/Shanghai
      - DOKUWIKI_USERNAME=admin
      - DOKUWIKI_PASSWORD=dokuwiki@9527
      #PHP_MEMORYLIMIT: 256M
      #PHP_UPLOADLIMIT: 128M
    volumes:
      #- ./storage:/storage
      - ${VOLUMES_PATH_HOST}/data/dokuwiki-data:/storage

  # N8N: Workflow automation tool
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      # Map container port 5678 to host port 9527 on all network interfaces
      - "9527:5678"
    environment:
      - N8N_PROTOCOL=http # Change to 'https' if a reverse proxy with SSL is set up in the future
      - N8N_HOST=localhost
      - WEBHOOK_URL=http://82.156.78.249:9527
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Shanghai
      # Mandatory Security Settings ===
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=singlesword
      - N8N_BASIC_AUTH_PASSWORD=sword_9527
      # Encryption key for securing credentials. KEEP THIS SAFE AND PERSISTENT.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # === Performance & Data Management (Optimized for 2-core 4GB) ===
      # Max payload size in MB for HTTP requests
      - N8N_MAX_PAYLOAD_SIZE=8
      # Enable automatic pruning of execution data
      - EXECUTIONS_DATA_PRUNE=true
      # Maximum age (in hours) to keep execution data
      - EXECUTIONS_DATA_MAX_AGE=72
      # Maximum number of execution entries to keep per workflow
      - EXECUTIONS_DATA_PRUNE_MAX_ENTRIES=50
      # Global limit for concurrent workflow executions
      - EXECUTIONS_PROCESS_CONCURRENT_LIMIT=5
    volumes:
      - ${VOLUMES_PATH_HOST}/data/n8n/n8n-data:/home/node/.n8n
      - ${VOLUMES_PATH_HOST}/data/n8n/n8n-local-files:/files

  # OpenClaw: AI agent management platform
  openclaw:
    # Recommended to use official stable image, Chinese optimized version is also available
    image: ghcr.nju.edu.cn/openclaw/openclaw:latest
    #image: ghcr.nju.edu.cn/1186258278/openclaw-zh:nightly

    container_name: openclaw
    restart: unless-stopped  # Auto-restart after NAS reboot

    ports:
      # Map ports, format: "Host port:Container port"
      - "18789:18789"        # OpenClaw core communication port
      - "3000:3000"          # Web UI console port

    volumes:
      # [Important] Replace the path before colon with your actual NAS path
      - ${VOLUMES_PATH_HOST}/data/openclaw/config:/home/node/.openclaw
      - ${VOLUMES_PATH_HOST}/data/openclaw/workspace:/home/node/.openclaw/workspace

    environment:
      - NODE_ENV=production   # Set to production environment
      - OPENCLAW_GATEWAY_BIND=lan  # fix the issue that the gateway cannot be accessed from the outside

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

  openclaw2:
    # Recommended to use official stable image, Chinese optimized version is also available
    image: ghcr.nju.edu.cn/openclaw/openclaw:latest
    #image: ghcr.nju.edu.cn/1186258278/openclaw-zh:nightly

    container_name: openclaw2
    restart: unless-stopped  # Auto-restart after NAS reboot

    ports:
      # Map ports, format: "Host port:Container port"
      - "19789:18789"        # OpenClaw core communication port
      - "4000:3000"          # Web UI console port

    volumes:
      # [Important] Replace the path before colon with your actual NAS path
      - ${VOLUMES_PATH_HOST}/data/openclaw2/config:/home/node/.openclaw
      - ${VOLUMES_PATH_HOST}/data/openclaw2/workspace:/home/node/.openclaw/workspace

    environment:
      - NODE_ENV=production   # Set to production environment
      - OPENCLAW_GATEWAY_BIND=lan

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mysql:
    driver: local

networks:
  ssdocker:
    driver: bridge